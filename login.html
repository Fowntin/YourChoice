<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | YourChoice</title>
  <link rel="stylesheet" href="style.css?v=v202610190707" />
</head>
<body>
  <header class="navbar">
    <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">YourChoice</a></div>
    <nav class="desktop-nav">
      <ul>
        <li><a href="index.html#hero">Home</a></li>
        <li><a href="index.html#products">Shop</a></li>
        <li><a href="index.html">🛒 Cart</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
    <div class="mobile-actions">
      <a href="index.html" class="drawer-btn drawer-btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; min-height: 38px; text-decoration: none;">← Store</a>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Login to your YourChoice account</p>
      </div>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username or Email *</label>
          <input type="text" id="username" name="username" required maxlength="100" autocomplete="username" />
        </div>
        
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="password" style="margin-bottom: 0;">Password *</label>
            <a href="#forgot" id="forgot-password-link" style="color: #ff6f00; font-size: 0.85rem; text-decoration: none; font-weight: 500;">Forgot Password?</a>
          </div>
          <input type="password" id="password" name="password" required maxlength="128" autocomplete="current-password" />
        </div>
        
        <button type="submit" class="auth-btn">Login</button>
      </form>
      
      <div id="auth-message" class="auth-message"></div>
      
      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-modal" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 9999; align-items: center; justify-content: center; padding: 1rem;">
    <div class="auth-card" style="max-width: 440px; position: relative; margin: 0 auto; box-shadow: 0 16px 40px rgba(0,0,0,0.25);">
      <button type="button" id="close-forgot-modal" aria-label="Close" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; color: #888; cursor: pointer; line-height: 1;">&times;</button>
      <div class="auth-header" style="margin-bottom: 1.25rem;">
        <h2 style="color: #ff6f00; font-size: 1.6rem; margin-bottom: 0.35rem;">Reset Password</h2>
        <p style="color: #666; font-size: 0.95rem;">Enter your email and we'll send you a secure reset link valid for 15 minutes.</p>
      </div>
      
      <form id="forgot-form" class="auth-form" style="gap: 1.25rem;">
        <div class="form-group">
          <label for="forgot-email">Account Email *</label>
          <input type="email" id="forgot-email" name="email" required placeholder="name@example.com" autocomplete="email" />
        </div>
        
        <button type="submit" id="forgot-submit-btn" class="auth-btn" style="font-size: 1rem; padding: 0.75rem;">Send Reset Link</button>
      </form>
      
      <div id="forgot-message" class="auth-message" style="display: none;"></div>
      
      <div class="auth-footer" style="margin-top: 1rem;">
        <p><a href="#" id="back-to-login-btn">Back to Login</a></p>
      </div>
    </div>
  </div>

  <script>
    // Detect redirect parameter or pending checkout intent
    const urlParams = new URLSearchParams(window.location.search);
    const redirectParam = urlParams.get('redirect');
    if (redirectParam) {
      sessionStorage.setItem('redirectAfterAuth', redirectParam);
    }
    const currentRedirect = sessionStorage.getItem('redirectAfterAuth') || redirectParam;
    if (currentRedirect && currentRedirect.includes('checkout')) {
      const banner = document.getElementById('auth-message');
      if (banner) {
        banner.textContent = 'Please log in to complete your checkout order.';
        banner.className = 'auth-message info';
        banner.style.display = 'block';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('auth-message');
      const submitBtn = e.target.querySelector('button[type="submit"]') || document.querySelector('.auth-btn');

      if (!username || !password) {
        messageEl.textContent = 'Please enter your username/email and password.';
        messageEl.className = 'auth-message error';
        return;
      }

      // Check online connectivity before attempting authentication
      if (typeof navigator !== 'undefined' && !navigator.onLine) {
        messageEl.textContent = 'You appear to be offline. Please check your internet connection and try again.';
        messageEl.className = 'auth-message error';
        return;
      }

      // Clean up any obsolete local user fallbacks
      try {
        localStorage.removeItem('localUsers');
      } catch (err) {}

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing In...';
      }
      messageEl.textContent = '';
      messageEl.className = 'auth-message';
      
      // Collect existing guest cart items (handles envelope and array)
      let guestCart = [];
      try {
        const rawCart = JSON.parse(localStorage.getItem('cart') || '[]');
        if (Array.isArray(rawCart)) {
          guestCart = rawCart;
        } else if (rawCart && Array.isArray(rawCart.items)) {
          guestCart = rawCart.items;
        }
      } catch (err) {
        guestCart = [];
      }

      // Collect existing guest wishlist items
      let guestWishlist = [];
      try {
        const rawWishlist = JSON.parse(localStorage.getItem('userWishlist') || '[]');
        if (Array.isArray(rawWishlist)) {
          guestWishlist = rawWishlist;
        }
      } catch (err) {
        guestWishlist = [];
      }

      const hadGuestItems = guestCart.length > 0 || guestWishlist.length > 0;

      function handleAuthSuccess(userData, syncNote, token) {
        localStorage.setItem('user', JSON.stringify(userData));
        localStorage.setItem('userLoggedIn', 'true');
        if (token) {
          localStorage.setItem('authToken', token);
        }

        // Keep saved customer details ready for frictionless checkout
        if (userData && typeof userData === 'object') {
          if (userData.phone) localStorage.setItem('savedCustomerPhone', userData.phone);
          if (userData.deliveryRegion) localStorage.setItem('savedCustomerRegion', userData.deliveryRegion);
          if (userData.deliveryTown) localStorage.setItem('savedCustomerTown', userData.deliveryTown);
          if (userData.deliveryLandmark) localStorage.setItem('savedCustomerLandmark', userData.deliveryLandmark);
          if (userData.deliveryGps) localStorage.setItem('savedCustomerGps', userData.deliveryGps);
          if (userData.name) localStorage.setItem('savedCustomerName', userData.name);
          if (userData.address) localStorage.setItem('savedCustomerAddress', userData.address);
        }

        const mergedCart = (userData && Array.isArray(userData.cart)) ? userData.cart : guestCart;
        localStorage.setItem('cart', JSON.stringify({
          items: mergedCart,
          lastUpdated: Date.now()
        }));

        const mergedWishlist = (userData && Array.isArray(userData.wishlist)) ? userData.wishlist : guestWishlist;
        localStorage.setItem('userWishlist', JSON.stringify(mergedWishlist));

        if (syncNote || hadGuestItems) {
          localStorage.setItem('syncMessage', syncNote || 'Welcome back! Your saved items have been preserved.');
        }

        // Resume interrupted checkout flow if intent was recorded
        const resumeUrl = sessionStorage.getItem('redirectAfterAuth') || 'index.html';
        sessionStorage.removeItem('redirectAfterAuth');

        messageEl.textContent = 'Login successful! Redirecting...';
        messageEl.className = 'auth-message success';
        setTimeout(() => {
          window.location.href = resumeUrl;
        }, 1000);
      }

      try {
        const response = await fetch('/api/users/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password, guestCart, guestWishlist })
        });
        
        if (response.ok) {
          const data = await response.json();
          handleAuthSuccess(data.user, hadGuestItems ? 'Welcome back! Your saved items have been synced to your account.' : null, data.token);
        } else if (response.status === 404 || response.status === 405) {
          messageEl.textContent = 'Authentication service is unavailable. Please verify the backend server is running and try again.';
          messageEl.className = 'auth-message error';
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
          }
        } else {
          const data = await response.json().catch(() => ({}));
          messageEl.textContent = data.error || (response.status === 401 ? 'Invalid username or password.' : 'Login failed. Please check your credentials and try again.');
          messageEl.className = 'auth-message error';
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
          }
        }
      } catch (error) {
        if (typeof navigator !== 'undefined' && !navigator.onLine) {
          messageEl.textContent = 'You appear to be offline. Please reconnect to the internet and try again.';
        } else {
          messageEl.textContent = 'Unable to connect to the authentication server. Please check your connection or verify the server is running, then try again.';
        }
        messageEl.className = 'auth-message error';
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      }
    });

    // Forgot Password Modal Handlers
    const forgotModal = document.getElementById('forgot-modal');
    const forgotLink = document.getElementById('forgot-password-link');
    const closeForgotModal = document.getElementById('close-forgot-modal');
    const backToLoginBtn = document.getElementById('back-to-login-btn');
    const forgotForm = document.getElementById('forgot-form');
    const forgotEmailInput = document.getElementById('forgot-email');
    const forgotMessage = document.getElementById('forgot-message');
    const forgotSubmitBtn = document.getElementById('forgot-submit-btn');

    function openForgotModal() {
      forgotModal.style.display = 'flex';
      forgotEmailInput.value = '';
      forgotMessage.style.display = 'none';
      forgotMessage.textContent = '';
      forgotMessage.className = 'auth-message';
      setTimeout(() => forgotEmailInput.focus(), 50);
    }

    function hideForgotModal() {
      forgotModal.style.display = 'none';
    }

    if (forgotLink) {
      forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        openForgotModal();
      });
    }

    if (closeForgotModal) {
      closeForgotModal.addEventListener('click', hideForgotModal);
    }

    if (backToLoginBtn) {
      backToLoginBtn.addEventListener('click', function(e) {
        e.preventDefault();
        hideForgotModal();
      });
    }

    window.addEventListener('click', function(e) {
      if (e.target === forgotModal) {
        hideForgotModal();
      }
    });

    if (forgotForm) {
      forgotForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = forgotEmailInput.value.trim();
        if (!email) return;

        forgotSubmitBtn.disabled = true;
        forgotSubmitBtn.textContent = 'Sending...';
        forgotMessage.style.display = 'none';

        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json().catch(() => ({}));

          forgotMessage.style.display = 'block';
          if (res.ok) {
            forgotMessage.className = 'auth-message success';
            forgotMessage.textContent = data.message || 'If that email exists, a reset link has been sent.';
            forgotForm.reset();
          } else {
            forgotMessage.className = 'auth-message error';
            forgotMessage.textContent = data.error || 'Failed to request reset link. Please try again.';
          }
        } catch (err) {
          forgotMessage.style.display = 'block';
          forgotMessage.className = 'auth-message error';
          forgotMessage.textContent = 'Network error. Please try again.';
        } finally {
          forgotSubmitBtn.disabled = false;
          forgotSubmitBtn.textContent = 'Send Reset Link';
        }
      });
    }
  </script>
</body>
</html>
