<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | YourChoice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">YourChoice</a></div>
    <nav class="desktop-nav">
      <ul>
        <li><a href="index.html#hero">Home</a></li>
        <li><a href="index.html#products">Shop</a></li>
        <li><a href="index.html">🛒 Cart</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
    <div class="mobile-actions">
      <a href="index.html" class="drawer-btn drawer-btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; min-height: 38px; text-decoration: none;">← Store</a>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Login to your YourChoice account</p>
      </div>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username or Email *</label>
          <input type="text" id="username" name="username" required />
        </div>
        
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" required />
        </div>
        
        <button type="submit" class="auth-btn">Login</button>
      </form>
      
      <div id="auth-message" class="auth-message"></div>
      
      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('auth-message');
      
      // Collect existing guest cart items (handles envelope and array)
      let guestCart = [];
      try {
        const rawCart = JSON.parse(localStorage.getItem('cart') || '[]');
        if (Array.isArray(rawCart)) {
          guestCart = rawCart;
        } else if (rawCart && Array.isArray(rawCart.items)) {
          guestCart = rawCart.items;
        }
      } catch (err) {
        guestCart = [];
      }

      // Collect existing guest wishlist items
      let guestWishlist = [];
      try {
        const rawWishlist = JSON.parse(localStorage.getItem('userWishlist') || '[]');
        if (Array.isArray(rawWishlist)) {
          guestWishlist = rawWishlist;
        }
      } catch (err) {
        guestWishlist = [];
      }

      const hadGuestItems = guestCart.length > 0 || guestWishlist.length > 0;

      try {
        const response = await fetch('/api/users/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password, guestCart, guestWishlist })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          messageEl.textContent = 'Login successful! Redirecting...';
          messageEl.className = 'auth-message success';
          
          // Store user info in localStorage
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('userLoggedIn', 'true');
          
          // Store merged cart with rolling TTL envelope
          const mergedCart = (data.user && Array.isArray(data.user.cart)) ? data.user.cart : guestCart;
          localStorage.setItem('cart', JSON.stringify({
            items: mergedCart,
            lastUpdated: Date.now()
          }));

          // Store merged wishlist indefinitely
          const mergedWishlist = (data.user && Array.isArray(data.user.wishlist)) ? data.user.wishlist : guestWishlist;
          localStorage.setItem('userWishlist', JSON.stringify(mergedWishlist));

          if (hadGuestItems || (mergedCart.length > 0 || mergedWishlist.length > 0)) {
            localStorage.setItem('syncMessage', 'Welcome back! Your saved items have been synced to your account.');
          }

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          messageEl.textContent = data.error || 'Login failed';
          messageEl.className = 'auth-message error';
        }
      } catch (error) {
        messageEl.textContent = 'Network error. Please try again.';
        messageEl.className = 'auth-message error';
      }
    });
  </script>
</body>
</html>
