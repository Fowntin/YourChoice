<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | YourChoice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">YourChoice</a></div>
    <nav class="desktop-nav">
      <ul>
        <li><a href="index.html#hero">Home</a></li>
        <li><a href="index.html#products">Shop</a></li>
        <li><a href="index.html">🛒 Cart</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="mobile-actions">
      <a href="index.html" class="drawer-btn drawer-btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; min-height: 38px; text-decoration: none;">← Back to Store</a>
    </div>
  </header>

  <main class="checkout-container">
    <h1>Checkout</h1>
    <section class="checkout-form-section">
      <div id="checkout-member-badge" class="checkout-member-badge" style="display: none;"></div>
      <form id="checkout-form">
        <h2>Customer Information</h2>
        <input type="text" id="customer-name" name="name" placeholder="Full Name" required />
        <input type="email" id="customer-email" name="email" placeholder="Email Address" required />
        <input type="tel" id="customer-phone" name="phone" placeholder="Phone Number" required />
        <input type="text" id="customer-address" name="address" placeholder="Delivery Address" required />
      </form>
    </section>
    <section class="order-summary-section">
      <h2>Order Summary</h2>
      <ul id="order-summary-list">
        <!-- Cart items will be loaded here -->
      </ul>
      <p class="order-total">Total: GH₵<span id="order-total">0.00</span></p>
      <button id="place-order-btn" type="submit" form="checkout-form">Place Order</button>
    </section>
    <div id="checkout-toast" class="toast"></div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <h2>Contact Us</h2>
      <p>Have questions or feedback? We'd love to hear from you.</p>
      <form>
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Email" required />
        <textarea placeholder="Your Message" rows="4" required></textarea>
        <button type="submit">Send Message</button>
      </form>
      <p class="copyright">© 2025 YourChoice. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Escape helper
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // Auto-prefill customer details for signed-in users
    function prefillCustomerDetails() {
      const userLoggedIn = localStorage.getItem('userLoggedIn') === 'true';
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const savedPhone = localStorage.getItem('savedCustomerPhone') || user.phone || '';
      const savedAddress = localStorage.getItem('savedCustomerAddress') || user.address || '';

      const nameInput = document.getElementById('customer-name');
      const emailInput = document.getElementById('customer-email');
      const phoneInput = document.getElementById('customer-phone');
      const addressInput = document.getElementById('customer-address');
      const badgeEl = document.getElementById('checkout-member-badge');

      if (userLoggedIn && (user.name || user.email || user.username)) {
        if (nameInput && !nameInput.value) nameInput.value = user.name || user.username || '';
        if (emailInput && !emailInput.value) emailInput.value = user.email || '';
        if (phoneInput && !phoneInput.value && savedPhone) phoneInput.value = savedPhone;
        if (addressInput && !addressInput.value && savedAddress) addressInput.value = savedAddress;

        if (badgeEl) {
          badgeEl.style.display = 'flex';
          badgeEl.innerHTML = `<span>✨ Signed in as <strong>${escapeHtml(user.name || user.username || 'Member')}</strong> — saved details loaded</span>`;
        }
      }
    }

    // Safely extract cart items from either the 14-day rolling envelope or legacy array
    function getCartItems() {
      try {
        const raw = JSON.parse(localStorage.getItem('cart') || '[]');
        if (Array.isArray(raw)) return raw;
        if (raw && Array.isArray(raw.items)) return raw.items;
        return [];
      } catch (e) {
        return [];
      }
    }

    // Load cart from localStorage and display order summary
    function loadOrderSummary() {
      const cart = getCartItems();
      const list = document.getElementById('order-summary-list');
      const totalEl = document.getElementById('order-total');
      let total = 0;
      list.innerHTML = '';
      if (cart.length === 0) {
        list.innerHTML = '<li>Your cart is empty.</li>';
        totalEl.textContent = '0.00';
        document.getElementById('place-order-btn').disabled = true;
        return;
      }
      cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} x${item.quantity} - GH₵${(item.price * item.quantity).toFixed(2)}`;
        list.appendChild(li);
        total += item.price * item.quantity;
      });
      totalEl.textContent = total.toFixed(2);
      document.getElementById('place-order-btn').disabled = false;
    }

    loadOrderSummary();
    prefillCustomerDetails();

    // Handle form submission and send order to backend
    document.getElementById('checkout-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const cart = getCartItems();
      if (cart.length === 0) {
        showToast('Your cart is empty!', 'error');
        return;
      }

      const formData = new FormData(e.target);
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      
      const orderData = {
        name: formData.get('name').trim(),
        email: formData.get('email').trim(),
        phone: formData.get('phone').trim(),
        address: formData.get('address').trim(),
        items: cart,
        total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0)
      };
      
      // Associate order with customer if logged in
      if (user.id) {
        orderData.userId = user.id;
      }

      const submitBtn = document.getElementById('place-order-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing Order...';

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(orderData)
        });

        const data = await response.json();

        if (response.ok) {
          // Persist customer contact details for future frictionless checkouts
          if (orderData.phone) localStorage.setItem('savedCustomerPhone', orderData.phone);
          if (orderData.address) localStorage.setItem('savedCustomerAddress', orderData.address);
          if (data.orderId) sessionStorage.setItem('justPlacedOrderId', data.orderId);

          showToast('Order placed successfully! Redirecting...', 'success');
          localStorage.removeItem('cart');

          // If logged in, clear account cart on server
          if (user.id || user.email) {
            try {
              fetch('/api/user/cart-wishlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id, email: user.email, cart: [] })
              });
            } catch (err) {
              // Non-blocking background sync
            }
          }

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          showToast(data.error || 'Failed to place order', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Place Order';
        }
      } catch (error) {
        console.error('Error placing order:', error);
        showToast('Network error. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Place Order';
      }
    });

    function showToast(message, type = 'success') {
      const toast = document.getElementById('checkout-toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
