<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | YourChoice</title>
  <link rel="stylesheet" href="style.css?v=v202610141142" />
</head>
<body class="admin-page-body">
  <div class="admin-login-container">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <h1>YourChoice</h1>
        <h2>Admin Dashboard</h2>
      </div>
      
      <div id="login-notice" class="admin-session-notice" style="display: none;"></div>
      
      <form id="admin-login-form" class="admin-login-form">
        <div class="form-group">
          <label for="username">Administrator Username</label>
          <input type="text" id="username" name="username" placeholder="e.g. Fowntin" required autocomplete="username" />
        </div>
        
        <div class="form-group">
          <label for="password">Administrator Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password" />
        </div>
        
        <button type="submit" class="admin-login-btn">Sign In to Dashboard</button>
      </form>
      
      <div id="login-message" class="login-message"></div>
      
      <div class="admin-links">
        <a href="index.html">← Return to Store</a>
      </div>
      <p class="admin-auth-note">Note: New administrators can only be created by an authenticated administrator within their dashboard.</p>
    </div>
  </div>

  <script>
    // Check if user was redirected from admin creation due to missing session
    const redirectNotice = sessionStorage.getItem('adminNotice');
    if (redirectNotice) {
      const noticeEl = document.getElementById('login-notice');
      if (noticeEl) {
        noticeEl.textContent = redirectNotice;
        noticeEl.style.display = 'block';
      }
      sessionStorage.removeItem('adminNotice');
    }
    document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('login-message');
      
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success && data.token) {
          messageEl.textContent = 'Login successful! Redirecting...';
          messageEl.className = 'login-message success';
          // Store verified JWT session token
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', data.admin?.username || username);
          localStorage.setItem('adminLoggedIn', 'true');
          // Redirect to dashboard
          setTimeout(() => {
            window.location.replace('admin-dashboard.html');
          }, 600);
        } else {
          messageEl.textContent = data.message || 'Login failed';
          messageEl.className = 'login-message error';
        }
      } catch (error) {
        messageEl.textContent = 'Network error. Please try again.';
        messageEl.className = 'login-message error';
      }
    });
  </script>
</body>
</html>
